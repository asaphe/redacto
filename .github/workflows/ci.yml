name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add rustfmt clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all
      - run: bash -n scripts/redacto-log-sweep.sh scripts/redacto-sinks.sh
      # bash -n catches syntax only; SC1091/SC2155 here were found by a downstream consumer's stricter gate.
      - name: shellcheck
        run: |
          shellcheck --version >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck; }
          shellcheck -x scripts/*.sh
      - run: python3 tests/probe-image-carrier-sweep.py
